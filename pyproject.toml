[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dorsal-pdf-extractor"
version = "0.1.0"
description = "Dorsal model: PDF Extractor"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dorsalhub>=0.8.3",
    "pytest>=9.0.2",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "dorsalhub-adapters>=0.2.0"
]

[project.entry-points."dorsal.models"]
pdf_extractor = "pdf_extractor"

[tool.hatch.build.targets.wheel]
packages = ["pdf_extractor"]

[tool.hatch.build.targets.wheel.force-include]
"model_config.toml" = "pdf_extractor/model_config.toml"
